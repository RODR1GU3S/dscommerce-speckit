name: CI - Testes Maven

"on":
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - chore/harness-foundation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Testes (Java 21 / Maven)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: .

    steps:
      - name: Checkout do código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configurar Java 21 (Zulu) e cache Maven
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: zulu
          java-version: '21'
          cache: maven

      - name: Exibir versões de Java e Maven
        run: |
          java --version
          ./mvnw --version

      - name: Executar testes
        run: ./mvnw --batch-mode --no-transfer-progress test

      - name: Publicar relatórios Surefire
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: warn
          retention-days: 14
