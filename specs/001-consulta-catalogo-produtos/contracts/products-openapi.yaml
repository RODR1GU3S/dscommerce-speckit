openapi: 3.0.3
info:
  title: DSCommerce Product Catalog API
  version: 0.1.0
paths:
  /products:
    get:
      summary: List catalog products
      description: Returns a paginated list of products ordered by name ascending.
      operationId: listProducts
      parameters:
        - name: page
          in: query
          required: false
          description: Zero-based page number. Defaults to 0.
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          required: false
          description: Page size. Defaults to 12 and must be between 1 and 50.
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 12
      responses:
        '200':
          description: Catalog page returned successfully. Content may be empty.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductCatalogPage'
              examples:
                firstPage:
                  summary: First page with products
                  value:
                    content:
                      - id: 1
                        name: "Notebook Gamer"
                        image: "https://cdn.example.com/products/notebook.jpg"
                        price: 4599.90
                    page: 0
                    size: 12
                    totalElements: 50
                    totalPages: 5
                emptyPage:
                  summary: Empty catalog page
                  value:
                    content: []
                    page: 9
                    size: 12
                    totalElements: 50
                    totalPages: 5
        '400':
          description: Invalid pagination parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidSize:
                  summary: Page size above maximum
                  value:
                    status: 400
                    error: "Bad Request"
                    message: "size must be between 1 and 50"
                    path: "/products"
components:
  schemas:
    ProductCatalogPage:
      type: object
      required:
        - content
        - page
        - size
        - totalElements
        - totalPages
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/ProductCatalogItem'
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
          maximum: 50
        totalElements:
          type: integer
          format: int64
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
    ProductCatalogItem:
      type: object
      required:
        - id
        - name
        - image
        - price
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          minLength: 1
        image:
          type: string
          minLength: 1
        price:
          type: number
          format: decimal
          minimum: 0
    ErrorResponse:
      type: object
      required:
        - status
        - error
        - message
        - path
      properties:
        status:
          type: integer
        error:
          type: string
        message:
          type: string
        path:
          type: string
