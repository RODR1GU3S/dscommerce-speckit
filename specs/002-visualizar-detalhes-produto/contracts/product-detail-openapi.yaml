openapi: 3.0.3
info:
  title: DSCommerce Product Detail API
  version: 0.1.0
paths:
  /products/{id}:
    get:
      summary: Get product details
      description: Returns the detail representation of one existing catalog product.
      operationId: getProductDetails
      parameters:
        - name: id
          in: path
          required: true
          description: Identifier of the selected catalog product.
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Product details returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDetail'
              examples:
                productWithCategories:
                  summary: Existing product with multiple categories
                  value:
                    id: 1
                    name: "Notebook Gamer"
                    description: "Notebook with dedicated graphics and high refresh display."
                    image: "https://cdn.example.com/products/notebook.jpg"
                    price: 4599.90
                    categories:
                      - "Computers"
                      - "Electronics"
        '404':
          description: Product was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                productNotFound:
                  summary: Missing product
                  value:
                    status: 404
                    error: "Not Found"
                    message: "Product not found"
                    path: "/products/999"
components:
  schemas:
    ProductDetail:
      type: object
      required:
        - id
        - name
        - description
        - image
        - price
        - categories
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          minLength: 1
        description:
          type: string
          minLength: 1
        image:
          type: string
          minLength: 1
        price:
          type: number
          format: decimal
          minimum: 0
        categories:
          type: array
          uniqueItems: true
          items:
            type: string
            minLength: 1
    ErrorResponse:
      type: object
      required:
        - status
        - error
        - message
        - path
      properties:
        status:
          type: integer
        error:
          type: string
        message:
          type: string
        path:
          type: string
