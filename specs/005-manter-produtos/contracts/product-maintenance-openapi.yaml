openapi: 3.0.3
info:
  title: DSCommerce Administrative Product Maintenance API
  version: 0.1.0
  description: >-
    Planned Feature 005 only. All operations require an authenticated account
    whose current database roles include ADMIN, independently of CLIENT.
    Public product GETs, login and order registration contracts remain unchanged.
    Business normalization, complete field diagnosis and error precedence are
    specified in README.md; schema validation alone does not prove business validity.
security:
  - bearerAuth: []
tags:
  - name: Administrative products
  - name: Existing categories
paths:
  /admin/products:
    get:
      tags: [Administrative products]
      operationId: listAdministrativeProducts
      summary: Locate products by a literal name substring
      description: >-
        ADMIN only. Trim external whitespace from name; absent or empty means no
        restriction. Compare LOWER on both operands with literal LOCATE, distinguishing
        accents and preserving internal spaces. Percent, underscore, slash and other
        characters are literal. Order by original name ASC then id ASC. Only name,
        page and size query parameters are accepted; repeated or unknown parameters
        are 400. Pagination and count use the same filter. Legacy products remain readable.
      x-requirements: [FR-001, FR-002, FR-003, FR-004, FR-005, FR-019, FR-020]
      parameters:
        - name: name
          in: query
          required: false
          description: Literal substring; external whitespace removed, internal whitespace preserved.
          schema:
            type: string
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Product page, including empty pages beyond the last result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminProductPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Administrative products]
      operationId: createAdministrativeProduct
      summary: Create a complete product with existing categories
      description: >-
        ADMIN only. Validate all detectable invalid fields and category references
        before any mutation. Repeated category identifiers represent one association.
        Unknown properties and repeated JSON property names are rejected.
        The operation is atomic; 201 is returned only after transaction completion.
        Repeating a successful request can create another product; no idempotency key.
      x-requirements: [FR-001, FR-002, FR-007, FR-008, FR-009, FR-010, FR-011, FR-012, FR-017, FR-019, FR-020]
      requestBody:
        $ref: '#/components/requestBodies/ProductWrite'
      responses:
        '201':
          description: Product created with a new identifier and unique category associations.
          headers:
            Location:
              description: URI of the implemented administrative detail resource, retaining any context path.
              schema:
                type: string
              example: /admin/products/101
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminProductDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'
  /admin/products/{id}:
    parameters:
      - $ref: '#/components/parameters/ProductId'
    get:
      tags: [Administrative products]
      operationId: getAdministrativeProduct
      summary: Read the complete product and current category associations for editing
      description: ADMIN only. Do not apply new write validation to legacy values. No query parameters.
      x-requirements: [FR-001, FR-002, FR-006, FR-013, FR-014, FR-019, FR-020]
      responses:
        '200':
          description: Existing product, including legacy values outside the new write rules.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminProductDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ProductNotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: [Administrative products]
      operationId: replaceAdministrativeProduct
      summary: Replace all five product data fields, retaining the product identifier
      description: >-
        ADMIN only. Missing required data is an error, not partial update. A valid
        body targeting a missing product is 404 and never creates a product.
        An invalid examinable body is diagnosed before checking target existence.
        Replace associations with distinct selected existing IDs; never delete categories.
        Historical purchase prices, subtotals and totals remain unchanged. No query parameters.
      x-requirements: [FR-001, FR-002, FR-008, FR-009, FR-010, FR-011, FR-012, FR-013, FR-014, FR-017, FR-018, FR-019, FR-020]
      requestBody:
        $ref: '#/components/requestBodies/ProductWrite'
      responses:
        '200':
          description: Complete replacement committed, with the same product identifier.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminProductDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ProductNotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Administrative products]
      operationId: deleteAdministrativeProduct
      summary: Delete only a product with no referential impediment
      description: >-
        ADMIN only. Any OrderItem referencing the product prevents deletion, regardless
        of order state. Preserve all categories, orders, items and historical values.
        The database foreign key is the final authority in concurrent operations.
        No query parameters or deletion of related entities to bypass integrity.
      x-requirements: [FR-001, FR-002, FR-014, FR-015, FR-016, FR-017, FR-018, FR-020]
      responses:
        '204':
          description: Product and only its category links deleted after transaction completion; no response body.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ProductNotFound'
        '409':
          $ref: '#/components/responses/ReferentialConflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /admin/categories:
    get:
      tags: [Existing categories]
      operationId: listExistingCategoryOptions
      summary: Read all existing category identifiers and names for selection
      description: >-
        ADMIN only. Return every existing category ordered by name ASC then id ASC,
        including categories without products and distinct IDs with equal names.
        Empty array when none exist. No query parameters, category search, hierarchy,
        reports or maintenance. Product associations are read in administrative product detail.
      x-requirements: [FR-001, FR-002, FR-006, FR-020]
      responses:
        '200':
          description: All category options, possibly empty.
          content:
            application/json:
              schema:
                type: array
                uniqueItems: true
                items:
                  $ref: '#/components/schemas/CategoryOption'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Existing HS256 login token; sub resolves the current account and ADMIN comes from database roles.
  parameters:
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        format: int32
        minimum: 0
        maximum: 2147483647
        default: 0
    Size:
      name: size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 12
    ProductId:
      name: id
      in: path
      required: true
      description: Positive representable Long identifier; malformed or out-of-range is 400, absent product is 404.
      schema:
        $ref: '#/components/schemas/PositiveId'
  requestBodies:
    ProductWrite:
      required: true
      description: Complete input; normalize text and diagnose all detectable invalid fields before mutation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProductWrite'
          example:
            name: '  Fone  Azul  '
            description: '  Descrição  completa  '
            price: '12.000'
            image: https://cdn.example.com/fone.jpg
            categoryIds: [1, 1, 2]
  responses:
    BadRequest:
      description: Invalid body, fields, parameters or nonexistent categories; all detectable field errors in an authorized examinable request are returned.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AdminError'
    Unauthorized:
      description: Missing, invalid or expired credential, invalid identity or account no longer existing.
      headers:
        WWW-Authenticate:
          schema:
            type: string
          example: Bearer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AdminError'
    Forbidden:
      description: Existing authenticated account without ADMIN; CLIENT alone is insufficient.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AdminError'
    ProductNotFound:
      description: Product does not exist; no upsert, false update/deletion confirmation or mutation of another product.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AdminError'
    ReferentialConflict:
      description: Confirmed referential restriction prevents deletion; all related data remain unchanged.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AdminError'
    NotAcceptable:
      description: No acceptable success representation; preserve native HTTP 406 and safe administrative error representation when writable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AdminError'
    UnsupportedMediaType:
      description: Unsupported request media type; preserve native HTTP 415 and supported-media headers.
      headers:
        Accept:
          schema:
            type: string
          example: application/json
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AdminError'
    InternalError:
      description: Safe internal failure, including account lookup, processing, unclassified integrity, timeout, flush or transaction completion.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AdminError'
  schemas:
    PositiveId:
      type: integer
      format: int64
      minimum: 1
      maximum: 9223372036854775807
      description: Integer token, not a coerced string, fractional token or boolean.
    ProductWrite:
      type: object
      additionalProperties: false
      required: [name, description, price, image, categoryIds]
      properties:
        name:
          type: string
          description: Required; 3 to 80 Unicode code points after external whitespace removal; store normalized form preserving internal spaces. No raw maxLength before normalization.
          x-normalized-min-length: 3
          x-normalized-max-length: 80
        description:
          type: string
          description: Required; at least 10 Unicode code points after external whitespace removal; preserve internal spaces. No business maximum.
          x-normalized-min-length: 10
        price:
          type: string
          pattern: '^-?(0|[1-9][0-9]*)(\.[0-9]+)?$'
          description: Exact decimal input; value must be positive and representable as NUMERIC(19,2) without rounding, max 99999999999999999.99. Extra fractional zeros are allowed; numeric JSON tokens, exponent, comma and spaces are rejected.
          example: '12.000'
        image:
          type: string
          format: uri
          minLength: 1
          pattern: '^[hH][tT][tT][pP][sS]?://'
          description: Absolute hierarchical syntactically valid http/https URI with server authority/host, no external availability check. Stored as supplied; no business maximum.
        categoryIds:
          type: array
          minItems: 1
          uniqueItems: false
          description: Every distinct identifier must exist; repeated identifiers produce one association, not an error. At least one distinct existing category required.
          items:
            $ref: '#/components/schemas/PositiveId'
    ReadMoney:
      type: string
      pattern: '^(0|[1-9][0-9]{0,16})\.[0-9]{2}$'
      description: Exact two-decimal representation; zero permitted for legacy reads only. New writes require positive price.
      example: '12.00'
    CategoryOption:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id:
          $ref: '#/components/schemas/PositiveId'
        name:
          type: string
    AdminProductItem:
      type: object
      additionalProperties: false
      required: [id, name, image, price]
      properties:
        id:
          $ref: '#/components/schemas/PositiveId'
        name:
          type: string
          description: Legacy reads are not subject to new write length/normalization rules.
        image:
          type: string
          description: Legacy reads need not satisfy the new image URL write rule.
        price:
          $ref: '#/components/schemas/ReadMoney'
    AdminProductDetail:
      type: object
      additionalProperties: false
      required: [id, name, description, image, price, categories]
      properties:
        id:
          $ref: '#/components/schemas/PositiveId'
        name:
          type: string
        description:
          type: string
        image:
          type: string
        price:
          $ref: '#/components/schemas/ReadMoney'
        categories:
          type: array
          uniqueItems: true
          description: Current distinct associations ordered by category name then id; may be empty on legacy products.
          items:
            $ref: '#/components/schemas/CategoryOption'
    AdminProductPage:
      type: object
      additionalProperties: false
      required: [content, page, size, totalElements, totalPages]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/AdminProductItem'
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
          maximum: 50
        totalElements:
          type: integer
          format: int64
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
    AdminError:
      type: object
      additionalProperties: false
      required: [status, error, message, path, errors]
      properties:
        status:
          type: integer
          minimum: 400
          maximum: 599
        error:
          type: string
          description: HTTP reason phrase.
        message:
          type: string
          description: Safe operation-level message fixed by README.md, never exception text.
        path:
          type: string
          description: External request URI retaining context path, without query or body.
        errors:
          type: array
          description: Deterministic field diagnoses; empty for authentication, authorization, not found, conflict and internal failures.
          items:
            $ref: '#/components/schemas/AdminFieldError'
    AdminFieldError:
      type: object
      additionalProperties: false
      required: [field, code, message]
      properties:
        field:
          type: string
          description: Known field, categoryIds[index], parameter or body; do not echo arbitrary unknown property names.
        code:
          type: string
          enum: [REQUIRED, INVALID_TYPE, INVALID_FORMAT, INVALID_LENGTH, NOT_POSITIVE, UNREPRESENTABLE_MONEY, INVALID_IMAGE_URL, EMPTY_CATEGORIES, CATEGORY_NOT_FOUND, UNKNOWN_FIELD, DUPLICATE_FIELD, INVALID_BODY, INVALID_PARAMETER]
        message:
          type: string
          description: Safe human-readable instruction identifying the correction without echoing the rejected value.
