openapi: 3.0.3
info:
  title: DSCommerce Public Catalog Name Filter - Feature 006
  version: 0.2.0
  description: >-
    Planned extension of the public GET /products contract. Not implemented or
    runtime-validated at this planning checkpoint. The new optional name filter
    intentionally replaces the previous behavior that ignored name. Historical
    contracts of Features 001-005 remain unchanged. Document version is not a new
    URL version. Product details remain accessible by ID under Feature 002.
security: []
x-status: planned
x-specification: ../spec.md
x-historical-catalog-contract: ../../001-consulta-catalogo-produtos/contracts/products-openapi.yaml
x-unchanged-detail-contract: ../../002-visualizar-detalhes-produto/contracts/product-detail-openapi.yaml
paths:
  /products:
    get:
      operationId: listProducts
      summary: List public products, optionally filtering by name
      description: >-
        Public access is unchanged, including an irrelevant invalid Bearer token.
        Remove only external whitespace from name, using the existing administrative
        whitespace semantics (including tab, NBSP and U+2003). Absent or empty after
        removal means no name restriction. Match a continuous literal substring,
        ignoring case and distinguishing accents. Preserve internal whitespace;
        percent, underscore, slash and other characters are literal, not wildcards.
        CAFÉ matches Café but not Cafe. Do not normalize stored or returned names.
        Pagination and totals describe the same filtered set. Order by original
        stored name ASC, then id ASC, as before. Each request supplies its own filter.
        No new policy for unknown or repeated query parameters is introduced.
        No canonical Unicode equivalence, accent removal, truncation or business
        length limit on the filter is introduced. A name filter never restricts
        GET /products/{id}. The route is relative to the deployment context.
      x-requirements: [FR-001, FR-002, FR-003, FR-004, FR-005, FR-006, FR-007, FR-008, FR-009, FR-010, FR-011, FR-012, FR-013, FR-014]
      parameters:
        - name: name
          in: query
          required: false
          allowEmptyValue: true
          description: >-
            Optional literal name substring. Trim external whitespace only;
            empty means unfiltered. No minLength, maxLength or truncation.
            Supply percent as URL-encoded %25 when using a raw URL; compare the
            decoded query value literally. Transport encoding is not a wildcard rule.
          schema:
            type: string
          examples:
            substring:
              value: fone
            externalSpaces:
              value: ' FONE '
            accented:
              value: CAFÉ
            literalPercent:
              value: '10%'
            literalUnderscore:
              value: kit_
            empty:
              value: ''
        - name: page
          in: query
          required: false
          description: >-
            Existing zero-based page number. Defaults to 0 when omitted or empty
            through the existing binding behavior. Existing invalid-pagination
            rejections are preserved, with or without name.
          schema:
            type: integer
            format: int32
            minimum: 0
            default: 0
        - name: size
          in: query
          required: false
          description: Existing page size; defaults to 12 when omitted or empty.
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 50
            default: 12
      responses:
        '200':
          description: >-
            Page of matching products. No matches returns empty content and zero
            totals. A page beyond the matching set is empty but retains the set's
            totals. Requested page and size are retained; no clamp or 404.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductCatalogPage'
              examples:
                filteredFirstPage:
                  summary: Five matches, first page of size two
                  value:
                    content:
                      - id: 105
                        name: Fone A
                        image: https://example.invalid/fone-a.jpg
                        price: 10.00
                      - id: 103
                        name: Fone B
                        image: https://example.invalid/fone-b.jpg
                        price: 12.50
                    page: 0
                    size: 2
                    totalElements: 5
                    totalPages: 3
                noMatches:
                  value:
                    content: []
                    page: 0
                    size: 12
                    totalElements: 0
                    totalPages: 0
                pageBeyondMatches:
                  value:
                    content: []
                    page: 3
                    size: 2
                    totalElements: 5
                    totalPages: 3
        '400':
          description: >-
            Existing invalid-pagination outcome. Numeric bound violations retain
            ErrorResponse (status, error, message, path). Native conversion errors
            retain the existing MVC/servlet handling and are not standardized by
            this extension; their baseline body must be characterized before and
            compared after implementation using real HTTP. No administrative
            errors array or rejection policy is introduced. No error is added for
            empty or long name filters.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/ErrorResponse'
                  - $ref: '#/components/schemas/ExistingNativePaginationError'
              examples:
                invalidSize:
                  value:
                    status: 400
                    error: Bad Request
                    message: size must be between 1 and 50
                    path: /products
components:
  schemas:
    ProductCatalogPage:
      type: object
      additionalProperties: false
      required: [content, page, size, totalElements, totalPages]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/ProductCatalogItem'
        page:
          type: integer
          format: int32
          minimum: 0
        size:
          type: integer
          format: int32
          minimum: 1
          maximum: 50
        totalElements:
          type: integer
          format: int64
          minimum: 0
        totalPages:
          type: integer
          format: int32
          minimum: 0
    ProductCatalogItem:
      type: object
      additionalProperties: false
      required: [id, name, image, price]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          minLength: 1
          description: Original stored text, including existing spaces and accents.
        image:
          type: string
          minLength: 1
        price:
          type: number
          format: decimal
          minimum: 0
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [status, error, message, path]
      properties:
        status:
          type: integer
        error:
          type: string
        message:
          type: string
        path:
          type: string
    ExistingNativePaginationError:
      type: object
      description: >-
        Deliberately open description of the preserved framework-generated
        conversion-error body, not a new guaranteed representation. Consequently,
        the 400 anyOf union alone cannot enforce ErrorResponse's four fields for
        Bean Validation bound errors. Validate those errors against ErrorResponse
        separately according to the request/error case, as required by the contract.
        Compare the actual native body to the pre-change HTTP baseline; do not
        implement a new DTO or handler to satisfy this branch.
      additionalProperties: true
