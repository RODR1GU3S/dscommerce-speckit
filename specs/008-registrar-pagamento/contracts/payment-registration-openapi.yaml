openapi: 3.0.3
info:
  title: DSCommerce Payment Registration - Feature 008
  version: 0.1.0
  description: >-
    Planned contract, not implemented or runtime-tested at this checkpoint.
    Records an ADMIN-declared single full settlement; no charging, gateway,
    external receipt verification or financial movement. Relative to servlet context.
x-status: planned
x-specification: ../spec.md
x-plan: ../plan.md
x-data-model: ../data-model.md
x-contract-precedence: README.md
x-business-reference: >-
  Capture one native-precision Instant at the start of business evaluation,
  before account lookup or order-lock waits. Preserve it throughout the attempt.
  createdAt <= occurredAt <= reference, inclusive. Receipt and commit are not
  alternative references. The reference is not an input, output or database field.
x-runtime-rules: >-
  Only WAITING_PAYMENT without an existing payment is eligible. Lock and refresh
  the order root, then check payment existence, state, temporal window and current
  ADMIN. Full amount derives only from historical order items; no amount input.
  Insert payment and set PAID atomically. A repeated settlement returns conflict,
  never a reused success. Two valid attempts on one order without other failures
  yield one acceptance; two eligible distinct orders permit both acceptances.
x-error-policy: >-
  Authenticate and authorize before MVC input handling. Application errors have
  exactly status/error/message/path and fixed response-specific triplets.
  path is request URI including servlet context, excluding query.
  No received value, buyer data, token, SQL or internal exception detail is echoed.
  Domain rejection never mutates data. Internal lookup, lock timeout, persistence,
  mapping or transaction-completion failure is 500, not inferred repetition.
x-commit-boundary: >-
  Construct HTTP 201 only after the owning transactional proxy commits.
  Flush and an internally constructed DTO do not prove commit.
  Failure delivering a response after commit does not undo the payment or PAID.
  Missing response or 500 is not proof of rollback; an indeterminate commit result
  must not cause compensation or automatic replay. A new POST after a completed
  settlement is rejected, not an idempotent retrieval.
security:
  - bearerAuth: []
paths:
  /admin/orders/{id}/payments:
    post:
      operationId: registerOrderPayment
      summary: Record a single full settlement for an order of any owner
      description: >-
        Require a valid existing account with current database ADMIN role;
        CLIENT is neither sufficient nor additionally required.
        Recheck scalar roles at business entry and after order-lock wait,
        before mutation. Role/name JWT claims are not the authority source.
        This write permission does not widen GET/HEAD ownership rules.
        No query parameters are accepted. Reject unknown/duplicate JSON fields,
        nonobject root, wrong token types and trailing JSON content.
        Existing payment gives 409 Payment already registered; otherwise a
        non-WAITING_PAYMENT state gives 409 Order is not awaiting payment.
        Temporal checks use parsed Instants, without rounding or re-capture.
      x-requirements: [FR-001, FR-002, FR-003, FR-004, FR-005, FR-006, FR-007, FR-008, FR-009, FR-010, FR-011, FR-012, FR-013, FR-014, FR-015, FR-020, FR-022]
      parameters:
        - name: id
          in: path
          required: true
          description: Positive signed-int64 order identifier. Invalid range/syntax is 400 after authorization.
          schema:
            type: integer
            format: int64
            minimum: 1
            maximum: 9223372036854775807
          example: 105
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentRegistrationRequest'
            examples:
              utc:
                value:
                  occurredAt: '2026-10-21T11:00:00.123Z'
              equivalentOffset:
                value:
                  occurredAt: '2026-10-21T08:00:00.123000000-03:00'
              wholeSecond:
                value:
                  occurredAt: '2026-10-21T11:00:00Z'
      responses:
        '201':
          description: >-
            Settlement and PAID committed. Exactly these three fields; no buyer,
            amount, payment identifier or new administrative GET/Location.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentConfirmation'
              example:
                orderId: 105
                occurredAt: '2026-10-21T11:00:00.123Z'
                status: PAID
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/OrderNotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/ProcessingFailure'
        '405':
          description: Native method rejection; preserve status and Allow header. No fixed JSON envelope promised.
          headers:
            Allow:
              schema:
                type: string
        '406':
          description: Native unacceptable representation; preserve status/headers without forcing an unacceptable JSON body.
        '415':
          description: Native unsupported media type; preserve status/headers. No fixed JSON envelope promised.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Existing signed credential resolved to a current account and database ADMIN role.
  schemas:
    OccurrenceInput:
      type: string
      format: date-time
      minLength: 20
      maxLength: 35
      pattern: '^(?!0000)(?!.*-00:00$)[0-9]{4}-(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01])T([01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9](\.[0-9]{1,3}0{0,6})?(Z|[+-]((0[0-9]|1[0-7]):[0-5][0-9]|18:00))$'
      description: >-
        Strict calendar-valid offset date-time, uppercase T/Z, seconds required,
        year 0001-9999 both locally and after UTC conversion.
        Offset Z or signed HH:MM at most 18:00; -00:00 is forbidden.
        Fraction is optional, at most nine digits, and must represent exact
        milliseconds: extra digits beyond three must be zero. No leap second,
        hour 24, whitespace, trimming, coercion or rounding. Normalize the same
        instant to UTC. Calendar validity and normalized year also require parser
        validation; the schema alone cannot assert the order/reference window.
    OccurrenceOutput:
      type: string
      format: date-time
      pattern: '^(?!0000)[0-9]{4}-(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01])T([01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9]\.[0-9]{3}Z$'
      description: Same accepted instant, canonical UTC with exactly three fraction digits.
    PaymentRegistrationRequest:
      type: object
      additionalProperties: false
      required: [occurredAt]
      properties:
        occurredAt:
          $ref: '#/components/schemas/OccurrenceInput'
    PaymentConfirmation:
      type: object
      additionalProperties: false
      required: [orderId, occurredAt, status]
      properties:
        orderId:
          type: integer
          format: int64
          minimum: 1
          maximum: 9223372036854775807
        occurredAt:
          $ref: '#/components/schemas/OccurrenceOutput'
        status:
          type: string
          enum: [PAID]
    PaymentError:
      type: object
      additionalProperties: false
      required: [status, error, message, path]
      description: Response-specific allOf constraints below enforce status/error/message correspondence.
      properties:
        status:
          type: integer
          enum: [400, 401, 403, 404, 409, 500]
        error:
          type: string
          enum: [Bad Request, Unauthorized, Forbidden, Not Found, Conflict, Internal Server Error]
        message:
          type: string
          enum: [Invalid payment data, Authentication required or invalid, Payment registration not permitted, Order not found, Payment already registered, Order is not awaiting payment, Payment registration could not be completed]
        path:
          type: string
          description: Requested URI with context path and without query.
  responses:
    InvalidInput:
      description: Invalid shape/type/id/query or occurrence outside the permitted window; no mutation.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/PaymentError'
              - properties:
                  status: {enum: [400]}
                  error: {enum: [Bad Request]}
                  message: {enum: [Invalid payment data]}
          example: {status: 400, error: Bad Request, message: Invalid payment data, path: /admin/orders/105/payments}
    Unauthenticated:
      description: Missing/invalid/expired credential or identified account absent; no order data.
      headers:
        WWW-Authenticate:
          schema:
            type: string
            enum: [Bearer]
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/PaymentError'
              - properties:
                  status: {enum: [401]}
                  error: {enum: [Unauthorized]}
                  message: {enum: [Authentication required or invalid]}
          example: {status: 401, error: Unauthorized, message: Authentication required or invalid, path: /admin/orders/105/payments}
    Forbidden:
      description: Current account has no ADMIN; no order data.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/PaymentError'
              - properties:
                  status: {enum: [403]}
                  error: {enum: [Forbidden]}
                  message: {enum: [Payment registration not permitted]}
          example: {status: 403, error: Forbidden, message: Payment registration not permitted, path: /admin/orders/105/payments}
    OrderNotFound:
      description: Authorized ADMIN supplied a valid ID without an order.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/PaymentError'
              - properties:
                  status: {enum: [404]}
                  error: {enum: [Not Found]}
                  message: {enum: [Order not found]}
          example: {status: 404, error: Not Found, message: Order not found, path: /admin/orders/999/payments}
    Conflict:
      description: Existing payment or incompatible state; preserve original settlement and all order data.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/PaymentError'
              - properties:
                  status: {enum: [409]}
                  error: {enum: [Conflict]}
                  message: {enum: [Payment already registered, Order is not awaiting payment]}
          examples:
            repeated:
              value: {status: 409, error: Conflict, message: Payment already registered, path: /admin/orders/105/payments}
            incompatible:
              value: {status: 409, error: Conflict, message: Order is not awaiting payment, path: /admin/orders/105/payments}
    ProcessingFailure:
      description: Internal account/order/history/lock/persistence/mapping/transaction failure; never substitute business rejection or success.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/PaymentError'
              - properties:
                  status: {enum: [500]}
                  error: {enum: [Internal Server Error]}
                  message: {enum: [Payment registration could not be completed]}
          example: {status: 500, error: Internal Server Error, message: Payment registration could not be completed, path: /admin/orders/105/payments}
